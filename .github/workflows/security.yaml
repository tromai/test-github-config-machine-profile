name: Dependency vulnerability scan

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # pip-audit can't check requirements without hashes, so skip the ops branch pin from
      # pyproject.toml's [tool.uv.sources]. Remove '--no-emit-package' when ops is released.
      - name: Export locked dependencies (excluding this project and the pinned ops branch)
        run: uv export --no-default-groups --frozen --no-emit-project --no-emit-package ops --no-emit-package ops-scenario --format requirements-txt -o requirements.txt

      - name: Run pip-audit
        run: uv run --frozen --only-group ci pip-audit --disable-pip -r requirements.txt
